name: Deploy to Amazon ECS

# One pipeline per environment branch; each branch deploys to its own AWS account via the OIDC
# role in that account (vars.AWS_DEPLOY_ROLE_ARN, scoped to its GitHub environment).
on:
  push:
    branches: ['main']

env:
  AWS_REGION: ap-south-2 # Hyderabad (India data residency)
  ECR_REPOSITORY: hms # repo name created by the CDK stack
  ECS_SERVICE: hms-backend-service # CDK FargateService (serviceName) — stable across accounts
  ECS_CLUSTER: hms-backend # CDK cluster (clusterName) — stable across accounts

permissions:
  contents: read
  id-token: write # required for OIDC role assumption

jobs:
  deploy:
    name: Deploy
    # ARM64 runner builds the linux/arm64 image natively — no QEMU emulation (faster, and avoids
    # the "qemu: Illegal instruction" crash). Matches the Fargate/Graviton (ARM64) task platform.
    runs-on: ubuntu-24.04-arm
    environment: production # must match the OIDC role's trust `sub` for this branch's account

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build once; push :<sha> (immutable, for traceability/rollback) and :latest (what the
      # CDK task definition references).
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --provenance=false \
            --sbom=false \
            --push .

      # Apply DB migrations BEFORE rolling the app, as a one-off ECS task in the VPC (RDS is in
      # isolated subnets, unreachable from this runner). We reuse the service's own task definition
      # (→ :latest, the image just pushed, which now ships the Prisma CLI + prisma/ migrations) and
      # its network configuration, overriding only the container command. Fails the deploy if the
      # migration container exits non-zero. See docs/architecture/config-and-secrets.md §Migrations.
      - name: Run database migrations (prisma migrate deploy)
        run: |
          set -euo pipefail
          TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION" \
            --query 'services[0].taskDefinition' --output text)
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION" \
            --query 'services[0].networkConfiguration' --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{"containerOverrides":[{"name":"hms","command":["npx","prisma","migrate","deploy"]}]}' \
            --region "$AWS_REGION" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION" \
            --query 'tasks[0].containers[?name==`hms`].exitCode | [0]' --output text)
          echo "Migration container exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Database migration failed (exit code $EXIT_CODE). Aborting deploy."
            exit 1
          fi

      # CDK owns the task definition; just force a new deployment so ECS re-pulls :latest.
      - name: Roll the ECS service onto the new image
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
